name: Publish to npm

on:
  push:
    tags:
      - 'v*'          # 触发条件：推送 v0.1.0、v1.2.3 等 tag

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm run build:lib

      - name: Verify WASM files exist
        run: |
          test -f public/minicad.js   || (echo "Missing public/minicad.js"   && exit 1)
          test -f public/minicad.wasm || (echo "Missing public/minicad.wasm" && exit 1)
          test -f public/minicad.data || (echo "Missing public/minicad.data" && exit 1)

      - name: Publish
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
